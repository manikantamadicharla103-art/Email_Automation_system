<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Email Automation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); min-height:100vh; display:flex; align-items:center; }
    .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.15); border-radius:20px; }
    .card-header { background:linear-gradient(135deg,#e94560,#0f3460); border-radius:20px 20px 0 0 !important; }
    .form-control { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; }
    .form-control:focus { background:rgba(255,255,255,0.15); border-color:#e94560; color:#fff; box-shadow:0 0 0 0.2rem rgba(233,69,96,0.25); }
    .form-control::placeholder { color:rgba(255,255,255,0.5); }
    .btn-login { background:linear-gradient(135deg,#e94560,#c23152); border:none; font-weight:600; letter-spacing:.5px; }
    .btn-login:hover { background:linear-gradient(135deg,#c23152,#a01f3d); transform:translateY(-1px); }
    label { color:rgba(255,255,255,0.8); }
    .logo-icon { font-size:2.5rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-lg">
        <div class="card-header text-center py-4">
          <div class="logo-icon mb-2">📧</div>
          <h4 class="text-white mb-0 fw-bold">Email Automation</h4>
          <small class="text-white-50">Admin Panel</small>
        </div>
        <div class="card-body p-4">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endwith %}
          <form method="POST">
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
              <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login btn-danger w-100 py-2">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <p class="text-center text-white-50 mt-3 mb-0 small">Default: admin / admin123</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
